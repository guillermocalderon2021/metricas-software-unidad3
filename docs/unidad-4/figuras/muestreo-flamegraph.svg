<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 0 960 258" role="img" aria-label="Diagrama didáctico de agrupación de diez muestras en un flame graph simplificado">
<rect width="960" height="258" fill="#fff"/>
<text x="32" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#172b42">Agrupación de 10 muestras sintéticas</text>
<text x="32" y="49" font-family="sans-serif" font-size="13" fill="#3d4b5a">El ancho corresponde al número de muestras que contienen el frame</text>
<g font-family="sans-serif" font-size="15" fill="#192636" stroke="#ffffff" stroke-width="2">
<rect x="30" y="182" width="900" height="45" fill="#b9d8ec"/><text x="45" y="210" stroke="none">main (10)</text>
<rect x="30" y="135" width="810" height="45" fill="#f4c47e"/><text x="45" y="163" stroke="none">procesar (9)</text>
<rect x="840" y="135" width="90" height="45" fill="#b4d8ad"/><text x="846" y="162" font-size="11" stroke="none">preparar (1)</text>
<rect x="30" y="88" width="540" height="45" fill="#f09577"/><text x="45" y="116" stroke="none">comparar (6)</text>
<rect x="570" y="88" width="270" height="45" fill="#e6acaa"/><text x="584" y="116" stroke="none">ordenar (3)</text>
</g>
<text x="30" y="246" font-family="sans-serif" font-size="12" fill="#4e5965">Esquema explicativo. No es una captura de perf ni una medición real.</text></svg>