site_name: Métricas de Software
site_description: Material académico del curso Métricas de Software
site_author: Guillermo Calderón

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Inicio: index.md
  - Unidad III. Instrumentación y observabilidad:
      - unidad-3/index.md
      - 3.1 Observabilidad y diseño de telemetría: unidad-3/3.1-observabilidad-y-telemetria.md
      - 3.2 Logging estructurado: unidad-3/3.2-logging-estructurado.md
      - 3.3 Prometheus e instrumentación de métricas: unidad-3/3.3-prometheus-instrumentacion-metricas.md
      - 3.4 PromQL - Analisis de series temporales: unidad-3/3.4-promql-analisis-series-temporales.md
      - 3.5 Dashboards y alertas: unidad-3/3.5-dashboards-alertas.md
      - 3.6 OpenTelemetry: unidad-3/3.6-opentelemetry.md
      - 3.7 Trazas distribuidas y correlación de señales: unidad-3/3.7-trazas-distribuidas-correlacion-senales.md
  - Laboratorios:
      - Laboratorio 3. Instrumentación de un servicio mediante logging estructurado y métricas: labs/laboratorio-3-instrumentacion-observabilidad.md 

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search
